(function(){
  var KEY='profile-access';
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function st(fn){try{return fn()}catch(e){return null}}
  async function decrypt(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
    return new TextDecoder().decode(buf);
  }
  function cleanHash(){
    try{var u=new URL(location.href);if(/^#k=/.test(u.hash)){u.hash='';history.replaceState(null,'',u.toString())}}catch(e){}
  }
  function show(html,pw){
    window.__PK=pw;
    cleanHash();
    document.open();document.write(html);document.close();
    window.__PK=pw;
  }
  async function attempt(pw,remember,silent){
    var box=document.getElementById('box');box.classList.add('busy');
    try{
      var html=await decrypt(pw);
      if(remember)st(function(){localStorage.setItem(KEY,pw)});
      show(html,pw);return true;
    }catch(e){
      box.classList.remove('busy');
      if(!silent)document.getElementById('err').textContent='비밀번호가 맞지 않습니다 · 密码不正确';
      return false;
    }
  }
  if(!(window.crypto&&crypto.subtle)){
    document.getElementById('err').textContent='이 브라우저에서는 열 수 없습니다. 다른 브라우저로 열어 주세요. · 当前浏览器不支持，请换用其他浏览器打开。';
  }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();attempt(document.getElementById('pw').value.trim(),document.getElementById('rem').checked,false)});
  (async function(){
    var m=location.hash.match(/^#k=([^&]+)/);
    if(m){var k=decodeURIComponent(m[1]);if(await attempt(k,true,true))return;}
    var saved=st(function(){return localStorage.getItem(KEY)});
    if(saved){if(await attempt(saved,false,true))return;st(function(){localStorage.removeItem(KEY)})}
    cleanHash();
  })();
